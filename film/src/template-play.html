<title>Harvest Gambit Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* One look in every theme: the page is a window onto the field at golden hour. */
:root {
  color-scheme: dark;
  --ink: #f4eddd; --dim: rgba(244,237,221,.7); --faint: rgba(244,237,221,.35);
  --panel: rgba(16,14,9,.66); --line: rgba(244,237,221,.16);
  --gold: #e8c77a; --good: #a9d46f; --warn: #f2a36c; --ground: #0b0c09;
  --f-display: "Cormorant Garamond", Georgia, serif;
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ground); overflow: hidden; color: var(--ink); font: 15px/1.45 var(--f-ui); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: 600 13px var(--f-ui); color: var(--ink); background: rgba(244,237,221,.08); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
button:hover { background: rgba(244,237,221,.16); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.primary { background: var(--gold); color: #231a05; border-color: var(--gold); }

#loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; background: radial-gradient(ellipse at 50% 60%, #2a2413, var(--ground)); transition: opacity .8s; }
#loading.gone { opacity: 0; pointer-events: none; }
.load-title { font: 500 clamp(34px, 6vw, 72px)/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; margin: 0; padding-left: .16em; }
#status { margin: 0; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }

#panel {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; gap: 10px;
  box-shadow: 0 20px 50px -20px rgba(0,0,0,.7);
}
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.top { justify-content: space-between; }
.kicker { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
#pz-nav { display: flex; gap: 4px; }
#pz-nav button { padding: 3px 9px; font-size: 12px; border-radius: 999px; }
#pz-nav button[aria-current="true"] { background: var(--gold); color: #231a05; border-color: var(--gold); }
h1 { margin: 0; font: 500 24px/1.15 var(--f-display); text-wrap: balance; }
h1 em { font-style: italic; color: var(--gold); }
#steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#steps li { border: 1px dashed var(--faint); border-radius: 8px; padding: 6px 8px; min-height: 40px; font-size: 13px; display: grid; align-content: center; }
#steps li b { font-weight: 600; font-size: 14px; }
#steps li span { color: var(--dim); font-size: 12px; }
#steps li.done { border-style: solid; border-color: var(--good); }
#steps li.retry { border-style: solid; border-color: var(--gold); }
#steps li.now { border-color: var(--ink); border-style: solid; }
#msg { margin: 0; color: var(--dim); min-height: 2.9em; }
#msg.bad { color: var(--warn); }
#msg.good { color: var(--good); }
#solved { display: grid; gap: 8px; }
#share { margin: 0; padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,.35); border: 1px solid var(--line); font: 500 14px/1.5 var(--f-ui); white-space: pre-wrap; user-select: all; }
.credit { margin: 0; font-size: 12px; color: var(--faint); }
.credit a { color: var(--dim); }
#sound { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 7px 12px; }
@media (max-width: 520px) {
  #panel { left: 16px; right: 16px; width: auto; padding: 14px; gap: 8px; }
  h1 { font-size: 21px; }
  #msg { min-height: 2.6em; font-size: 14px; }
}
</style>

<canvas id="c"></canvas>
<div id="loading"><p class="load-title">Harvest Gambit</p><p id="status">Growing the wheat…</p></div>
<button id="sound" hidden aria-pressed="false">Sound off</button>
<section id="panel" hidden aria-live="polite">
  <div class="row top"><p class="kicker" id="pz-name">Harvest Gambit #1</p><nav id="pz-nav" aria-label="Choose a puzzle"></nav></div>
  <h1>Livestock, the cream pieces, to move. <em>Mate in 3.</em></h1>
  <ol id="steps" aria-label="Your moves"><li></li><li></li><li></li></ol>
  <p id="msg"></p>
  <div id="solved" hidden>
    <pre id="share"></pre>
    <div class="row"><button id="copy" class="primary">Copy result</button><button id="next">Next puzzle</button></div>
  </div>
  <div class="row" id="actions"><button id="hint">Hint</button><button id="reset">Start over</button></div>
  <p class="credit">Puzzle <a id="pz-link" href="https://lichess.org/training" target="_blank" rel="noopener">from the Lichess database</a> · drag to look around</p>
</section>

<script type="importmap">
